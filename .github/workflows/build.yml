# =============================================================================
#  Opti Morning  --  automatic combined build
# =============================================================================
#
#  WHAT IT DOES (every day, and whenever you press "Run workflow")
#    1. Takes the latest official OptiScaler code (the same code the official
#       nightlies are built from).
#    2. Adds dashdogy's OptiScaler work that is NOT in official OptiScaler yet:
#         - pull request #1240  (XeFG on Vulkan)
#         - commit 6089672c     (menu/overlay + FSR-FG present fix, "pairfix.1")
#    3. Builds OptiScaler on a Windows machine.
#    4. Builds FakeMichau's dlssg-to-xefg from source
#       (-> dlssg_to_xefg_intel_is_better.dll).
#    5. Builds realdody's dlssg-to-xefg (the XMX multi-frame-generation fork)
#       from source (-> a second dlssg_to_xefg_intel_is_better.dll). The same
#       build also produces its xefg_mfg_programs folder (XeSS MFG program set
#       + tensor-core fatbin), see "HOW xefg_mfg_programs IS MADE" below.
#    6. Downloads the latest official MFG Unlocker release from dashdogy
#       (-> MFGUnlocker.dll).
#    7. Puts everything into ONE 7z and publishes it as a normal release on the
#       Releases tab of THIS repository, titled
#       "Opti Morning <date> (<upstream commit>)".
#
#  WHAT IS INSIDE THE 7Z
#       OptiScaler.dll, OptiScaler.ini, ...         the normal nightly files
#       OptiScaler/                                 the normal nightly folder
#         Streamlined_fetcher_windows.bat           copied from the OptiScaler
#                                                   source, as in the nightlies
#         plugins/MFGUnlocker.asi                   MFGUnlocker.dll, renamed
#         custom/NvngxXeFG/dlssg/
#           dlssg_to_xefg_intel_is_better.dll       built from FakeMichau's repo
#           libxe*.dll                              copies (not moves) of the
#                                                   libxe*.dll files that sit in
#                                                   the OptiScaler folder
#         custom/XeMFG XMX/dlssg/                   (folder name: DLSSG_MX_FOLDER)
#           dlssg_to_xefg_intel_is_better.dll       built from realdody's repo
#           libxe*.dll                              copies, same as above
#           xefg_mfg_programs/                      made by realdody's build
#                                                   (program set, tensor-core
#                                                   fatbin, MFG-Unlocker's MIT
#                                                   LICENSE)
#         combined-source.patch                     GPL source, see LICENCE
#       Licenses/
#         dlssg-to-xefg-realdody_LICENSE.txt        licence and notice files of
#         dlssg-to-xefg-realdody_NOTICE.md          realdody's fork
#
#  THE RELEASE DESCRIPTION is split by origin, so you can see who contributed
#  what: "OptiScaler nightly" (the base), "dashdogy" (his OptiScaler changes and
#  the MFG Unlocker release), "FakeMichau" and "realdody" (their dlssg-to-xefg
#  commits; realdody's with a note on his program set), then a short "Install"
#  section. The OptiScaler, FakeMichau and realdody sections list the commits
#  made since the PREVIOUS release of this repository (newest first, at most
#  NOTES_MAX_COMMITS each, plus a compare link). To know where the previous
#  release stopped, every description ends with a hidden HTML comment holding
#  the three commit IDs; for releases made before that existed, the IDs are read
#  from the commit links in their description. No earlier release, or the
#  lookup fails? The section just names this build's commit.
#
#  WHY MFG UNLOCKER IS DOWNLOADED AND NOT BUILT
#    Its BUILD.md says a source checkout alone cannot produce the DLL: it also
#    needs separately prepared inputs (the XeSS Frame Generation program set and
#    the SM86 kernel caches) that are not in the repository. So the workflow
#    takes the DLL from the official release, unmodified.
#
#  HOW xefg_mfg_programs IS MADE
#    realdody's DLL reads that folder (the XeSS MFG program set plus the
#    tensor-core fatbin xefg_cuda_layers.fatbin) from next to itself. It is not
#    committed to his repository and is no longer taken from his releases: his
#    build downloads the pinned MFG-Unlocker release DLL (v1.7.0 at the time of
#    writing), checks the download and its contents against pinned SHA-256
#    values and extracts the folder into bin\Release, together with
#    MFG-Unlocker's MIT LICENSE. No CUDA toolkit and no MFG-Unlocker checkout
#    are needed. So this workflow only builds the project and copies
#    bin\Release\xefg_mfg_programs next to the built DLL. Two things follow:
#      - The runner needs internet access during that build (it has it). A
#        failed download or a hash mismatch fails the build, so nothing is
#        published.
#      - Do NOT pass /p:MfgUnlockerDll (that is for offline builds, and the
#        MFGUnlocker.dll downloaded for the plugin below may be a different
#        release than the pinned one) and do NOT set CudaRoot (it overwrites
#        the pinned fatbin with a locally built one).
#
#  SAFETY RULES BUILT IN
#    - Nothing changed since the last build (same upstream commit, PR head,
#      MFG Unlocker release and both dlssg-to-xefg commits)? It does nothing.
#      (The program set is pinned by realdody's commit, so it needs no entry.)
#    - The MFG-Unlocker download inside realdody's build fails or does not match
#      its pinned hashes, or the finished build has no xefg_mfg_programs
#      folder? The run FAILS and nothing is published.
#    - dashdogy's changes no longer fit the newest upstream code? The run FAILS
#      (red X, you get an email) and NO release is published. The previous
#      release stays available. The only exception is a conflict listed in
#      "Known conflict resolutions" (inside the "Plan and merge" step): there,
#      both sides must match the text that was reviewed by hand, character for
#      character. Any other conflict, or the same place changed again, still
#      FAILS. Once dashdogy updates his pull request (or upstream merges it),
#      the entry is simply never used and can be deleted.
#    - Any download or build fails, or an expected file is missing? Same: the
#      run fails and nothing half-built is published.
#    - Upstream merges one of dashdogy's changes itself? The workflow notices and
#      stops adding it. The build still goes on, because MFG Unlocker and
#      dlssg-to-xefg are still part of the package.
#
#  ORDER OF THE RELEASES LIST
#    GitHub sorts the Releases page by the DATE (the calendar day, NOT the time
#    of day) of the commit each release's tag points to, not by publish time.
#    Releases of the same day are then ordered by tag name, reverse
#    alphabetical (our tags are not version numbers). So two things are done:
#      - every release gets its own tag commit, dated at build time, so a build
#        on a later day always sorts above one from an earlier day;
#      - every tag is named build-<UTC date>-<UTC time>-<fingerprint>, so a
#        later build on the SAME day also sorts above an earlier one.
#    (See "Tag name and sorting fix" in the publish step.) The small tag commits
#    are only reachable through the release tags; they do not appear on any
#    branch. Older releases with a plain build-<fingerprint> tag are still
#    recognised.
#
#  BUILD TOOLS (Visual Studio versions)
#    The job runs on GitHub's "windows-latest" machine, which since June 2026 has
#    Visual Studio 2026. Every project picks its own compiler version ("platform
#    toolset") in its own project file, so the builds do not have to match:
#      - OptiScaler builds with whatever its project file asks for. It already
#        built fine on windows-latest before this change.
#      - FakeMichau's dlssg-to-xefg says "use the installed Visual Studio's own
#        toolset" (it only needs C++20), so it adapts to VS 2022 or VS 2026.
#        Since 2026-11-04 it also has a Vulkan/D3D12 layer: its two git submodules
#        (Vulkan-Headers, dxil-spirv, plus two nested ones of dxil-spirv) are fetched
#        in the "Fetch add-ons" step, and its project runs CMake to build dxil-spirv
#        (a few extra minutes). A fetch WITHOUT those submodules fails to compile.
#        The same step also fetches realdody's submodules if his fork ever gets any
#        (he has none today, so for him it does nothing).
#      - realdody's dlssg-to-xefg asks for Visual Studio 2026 (v145 toolset),
#        which windows-latest provides. An image with only VS 2022 (for
#        example windows-2022) cannot build it.
#    The build step prints the MSBuild version, so the log shows what was used.
#    If a build ever fails with "MSB8020 ... build tools for v145 cannot be
#    found", the machine has no VS 2026: use an image that has it. If it fails
#    with the same message for v143, a project wants VS 2022 and the machine
#    only has VS 2026 (and no v143 component).
#
#  HOW TO USE (first time)
#    1. Create a new PUBLIC repository on GitHub (public = free build minutes).
#    2. Put this file in .github/workflows/ (for example build.yml).
#    3. Actions tab -> "Opti Morning (combined build)" -> Run workflow.
#    4. After ~15-25 minutes the build appears under "Releases".
#
#    Only if the run fails when publishing with "Resource not accessible by
#    integration": Settings -> Actions -> General -> Workflow permissions ->
#    "Read and write permissions" -> Save, then run it again.
#
#  THINGS YOU MAY WANT TO EDIT: only the `env:` block below.
#
#  HEADS-UP: GitHub pauses scheduled workflows in a repository that has had no
#  commits for 60 days. If that happens, GitHub emails you; click "Enable".
#
#  LICENCE: OptiScaler and both dlssg-to-xefg versions are GPL-3.0. Whenever the
#  build differs from upstream, the package includes
#  OptiScaler/combined-source.patch (the exact OptiScaler changes on top of the
#  named upstream commit), and the release names the exact commit of each
#  dlssg-to-xefg. MFGUnlocker.dll is MIT, but embeds Intel XeSS program data that
#  stays under Intel's terms (see its NOTICE.md). The same goes for realdody's
#  fork: it contains MIT code ported from MFG-Unlocker, and the xefg_mfg_programs
#  folder is Intel XeSS program data under Intel's terms (the folder carries
#  MFG-Unlocker's MIT LICENSE itself). The fork's LICENSE and NOTICE.md are
#  copied into Licenses/ of the package.
# =============================================================================

name: Opti Morning (combined build)

on:
  schedule:
  - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "OptiScaler branch, tag or commit to build on top of"
        default: "master"
      force:
        description: "Rebuild even if this exact combination was already released"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: combined-build
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

  UPSTREAM_REPO: optiscaler/OptiScaler
  DASH_REPO: dashdogy/OptiScaler

  # The open pull request to add. If upstream merges it, it is skipped
  # automatically. If a new PR replaces it, change this number.
  PR_NUMBER: "1240"

  # Extra single commits from dashdogy's fork to add after the PR.
  # One FULL 40-character commit ID per line; text after # is a comment.
  EXTRA_COMMITS: |
    6089672c10b13e8aaca50b94ee1bfc2b51c70d30  # pairfix.1: menu/overlay allocator ring + FSR-FG present while FG is off

  # dashdogy's MFG Unlocker: the DLL is taken from its latest release.
  MFG_REPO: dashdogy/MFG-Unlocker

  # FakeMichau's dlssg-to-xefg: built from this branch (or tag, or commit).
  DLSSG_REPO: FakeMichau/dlssg-to-xefg
  DLSSG_REF: master

  # realdody's dlssg-to-xefg (XMX multi-frame-generation fork): built from this
  # branch (or tag, or commit). The repository was renamed from
  # realdody/dlssg-to-xefg to realdody/dlssg-to-xefg-xmx (the old name still
  # redirects, but use the real name). The build itself downloads the pinned
  # MFG-Unlocker release and extracts the xefg_mfg_programs folder (program set
  # + tensor-core fatbin) into bin\Release, so nothing else has to be fetched.
  DLSSG_MX_REPO: realdody/dlssg-to-xefg-xmx
  DLSSG_MX_REF: master

  # Folder name under OptiScaler/custom/ for realdody's build. OptiScaler lists
  # this name in its menu. realdody's readme now says "XeMFG XMX" (it used to be
  # NvngxXeFGXMX). The space is fine: every path in this file is quoted. Note
  # that OptiScaler keeps the plugin's settings under [Plugin.<name>] in
  # OptiScaler.ini, so changing the name makes users start with default settings.
  DLSSG_MX_FOLDER: XeMFG XMX

  # How many combined releases to keep (older ones are deleted). 0 = keep all.
  KEEP_RELEASES: "20"

  # Most commits listed per section of the release notes. Anything beyond that
  # becomes one "and N older commits" line (the compare link has them all).
  NOTES_MAX_COMMITS: "30"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out official OptiScaler
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || 'master' }}
          fetch-depth: 0
          submodules: false
          path: src

      - name: Plan and merge
        id: plan
        working-directory: src
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          INCLUDED="$OUT/included.md"   # lines for the dashdogy section of the notes
          : > "$INCLUDED"

          # "build=true" is only written at the very end. Any early exit leaves
          # it empty, which makes every later step skip itself.

          # ---- 1. What goes into this build ----------------------------------
          UP_SHA=$(git rev-parse HEAD)
          UP_SHORT=$(git rev-parse --short=8 HEAD)
          UP_DATE=$(git log -1 --format=%cs)
          UP_SUBJECT=$(git log -1 --format=%s)

          MFG_TAG=$(gh release view --repo "$MFG_REPO" --json tagName --jq '.tagName')
          read -r DLSSG_SHA DLSSG_SUBJECT <<< "$(gh api "repos/$DLSSG_REPO/commits/$DLSSG_REF" --jq '.sha + " " + (.commit.message | split("\n")[0])')"
          read -r PR_STATE PR_MERGED PR_TITLE <<< "$(gh api "repos/$UPSTREAM_REPO/pulls/$PR_NUMBER" --jq '"\(.state) \(.merged) \(.title)"')"

          # realdody's dlssg-to-xefg: the commit to build. (Its xefg_mfg_programs
          # folder is made by the build itself, from the MFG-Unlocker release the
          # source pins, so the commit alone decides which program set is used.)
          read -r DLSSG_MX_SHA DLSSG_MX_SUBJECT <<< "$(gh api "repos/$DLSSG_MX_REPO/commits/$DLSSG_MX_REF" --jq '.sha + " " + (.commit.message | split("\n")[0])')"
          [ -n "$DLSSG_MX_SHA" ] || { echo "::error::Could not read '$DLSSG_MX_REF' of $DLSSG_MX_REPO."; exit 1; }

          echo "Upstream:      $UP_SHORT  $UP_SUBJECT  ($UP_DATE)"
          echo "MFG Unlocker:  $MFG_TAG"
          echo "dlssg-to-xefg: ${DLSSG_SHA:0:8}  $DLSSG_SUBJECT"
          echo "dlssg-to-xefg (realdody): ${DLSSG_MX_SHA:0:8}  $DLSSG_MX_SUBJECT"

          PR_HEAD="merged"
          if [ "$PR_MERGED" = "true" ]; then
            echo "::notice::PR #$PR_NUMBER is already merged into upstream, nothing extra to add for it."
          else
            [ "$PR_STATE" = "open" ] || echo "::warning::PR #$PR_NUMBER was closed without being merged. Building it anyway; check whether a newer PR replaced it."
            git fetch --no-tags origin "pull/$PR_NUMBER/head:refs/remotes/pr/$PR_NUMBER"
            PR_HEAD=$(git rev-parse "refs/remotes/pr/$PR_NUMBER")
          fi

          EXTRAS=""
          while IFS= read -r line; do
            line=$(printf '%s' "${line%%#*}" | tr -d '[:space:]')
            [ -z "$line" ] && continue
            [[ "$line" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::EXTRA_COMMITS needs full 40-character commit IDs. Got: $line"; exit 1; }
            EXTRAS="$EXTRAS $line"
          done <<< "$EXTRA_COMMITS"

          # ---- 2. Same inputs as an existing release? Then nothing to do -----
          # FP identifies the inputs. The tag of a release is
          # build-<UTC date>-<UTC time>-<FP> (made in the publish step; the time
          # is what keeps same-day releases in order). Releases made before that
          # change are just build-<FP>. Both forms count as "already built".
          FP=$(printf '%s\n' "$UP_SHA" "$PR_HEAD" $EXTRAS "$MFG_TAG" "$DLSSG_SHA" "$DLSSG_MX_SHA" | sha1sum | cut -c1-12)
          SAME_TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' 2> /dev/null \
            | tr -d '\r' | grep -E "^build-([0-9]{8}-[0-9]{6}-)?$FP\$" || true)
          if [ "$FORCE" != "true" ] && [ -n "$SAME_TAGS" ]; then
            SAME_FIRST=$(printf '%s\n' "$SAME_TAGS" | head -n 1)
            echo "::notice::Nothing new since the last build ($SAME_FIRST already exists)."
            echo "### Nothing to do: \`$SAME_FIRST\` already contains upstream \`$UP_SHORT\`, the same dashdogy changes, MFG Unlocker \`$MFG_TAG\`, dlssg-to-xefg \`${DLSSG_SHA:0:8}\` and realdody's dlssg-to-xefg \`${DLSSG_MX_SHA:0:8}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- 2b. Where the previous release stopped ------------------------
          # (for the "changes since the last release" lists in the notes)
          # Every release body ends with a hidden comment holding the commits it
          # was built from. Releases made before that existed are read from the
          # commit links in their description. A forced rebuild skips its own
          # release(s), so it compares against the release before them.
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[].tagName | select(startswith("build-"))' \
            | tr -d '\r' | grep -vxF -f <(printf '%s\n' "$SAME_TAGS") | head -n 1 || true)
          PREV_BODY=""
          if [ -n "$PREV_TAG" ]; then
            PREV_BODY=$(gh release view "$PREV_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2> /dev/null | tr -d '\r' || true)
          fi
          prev_sha() {   # $1 = key in the hidden comment, $2 = owner/repo for old-style descriptions
            local s
            s=$(printf '%s\n' "$PREV_BODY" | grep -oE "$1=[0-9a-f]{40}" | head -n 1 | cut -d= -f2 || true)
            [ -n "$s" ] || s=$(printf '%s\n' "$PREV_BODY" | grep -oE "github[.]com/$2/commit/[0-9a-f]{40}" | head -n 1 | grep -oE '[0-9a-f]{40}$' || true)
            printf '%s' "$s"
          }
          PREV_UP_SHA=$(prev_sha upstream "$UPSTREAM_REPO")
          PREV_DLSSG_SHA=$(prev_sha fakemichau "$DLSSG_REPO")
          PREV_DLSSG_MX_SHA=$(prev_sha realdody "$DLSSG_MX_REPO")
          echo "Previous release: ${PREV_TAG:-none}  (upstream ${PREV_UP_SHA:0:8}, FakeMichau ${PREV_DLSSG_SHA:0:8}, realdody ${PREV_DLSSG_MX_SHA:0:8})"

          # ---- 3. Merge dashdogy's OptiScaler changes onto upstream ----------
          git config user.name  "combined-build"
          git config user.email "combined-build@users.noreply.github.com"

          give_up() {
            {
              echo "### Build skipped: $1 no longer fits upstream \`$UP_SHORT\`"
              echo "Files in conflict:"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo "No release was published; the previous release is untouched. Usually dashdogy has to update his pull request. Running again later may work."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Merge conflict::$1 does not apply cleanly on upstream $UP_SHORT. See the run summary."
            exit 1
          }

          # ---- Known conflict resolutions ------------------------------------
          # When upstream and the pull request change the same lines, git stops
          # with a conflict. A conflict that was looked at by hand is listed in
          # FIXES below: the exact text of both sides and the text to use. It is
          # only resolved when EVERY conflict in the merge matches an entry on
          # BOTH sides (trailing blanks ignored). Otherwise nothing is touched
          # and the run fails through give_up, as before.
          #
          # Entry 1 (upstream cdozdil, 2026-11-04, "Fix Vulkan FG and shader sync"
          # vs. PR #1240): upstream added fIndex = fg->GetIndex(), the PR added a
          # "fg == nullptr" early return. Both are wanted, and the null check has
          # to come first because GetIndex() would dereference a null fg.
          resolve_known_conflicts() { # $1 = file that receives the list of resolved files
            local py
            py=$(command -v python || command -v python3) || { echo "::warning::No Python found, cannot resolve known conflicts."; return 1; }
            "$py" - "$1" << 'PY'
          import re, subprocess, sys

          OURS_1 = (
              "    // The render thread can start the next frame meanwhile, all three go to this frame\n"
              "    const auto fIndex = fg->GetIndex();\n"
          )
          THEIRS_1 = (
              "    // The hudless is rebuilt on the Vulkan FG output, the DX12 one VkwDx12SC presents through only gets the candidates\n"
              "    if (fg == nullptr)\n"
              "        return;\n"
          )
          FIXES = {
              "OptiScaler/hudfix/Hudfix_Vk.cpp": [
                  (OURS_1, THEIRS_1, THEIRS_1 + "\n" + OURS_1),
              ],
          }

          def norm(t):
              return "\n".join(line.rstrip() for line in t.split("\n")).strip("\n")

          unmerged = subprocess.run(["git", "diff", "--name-only", "--diff-filter=U"],
                                    capture_output=True, text=True, check=True).stdout.split()
          if not unmerged:
              sys.exit("no conflicted files found")

          block_re = re.compile(r"^<<<<<<< [^\n]*\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]*\n", re.S | re.M)
          done = {}
          for path in unmerged:
              if path not in FIXES:
                  sys.exit("no known resolution for " + path)
              raw = open(path, newline="").read()
              crlf = "\r\n" in raw
              text = raw.replace("\r\n", "\n")
              fixes = list(FIXES[path])

              def pick(m):
                  for fix in fixes:
                      if norm(m.group(1)) == norm(fix[0]) and norm(m.group(2)) == norm(fix[1]):
                          return fix[2]
                  sys.exit("conflict in %s does not match a known resolution" % path)

              out = block_re.sub(pick, text)
              if re.search(r"^(<<<<<<<|=======|>>>>>>>)", out, re.M):
                  sys.exit("conflict markers left in " + path)
              done[path] = out.replace("\n", "\r\n") if crlf else out

          for path, out in done.items():
              open(path, "w", newline="").write(out)
              subprocess.run(["git", "add", path], check=True)
              print("::notice::Resolved a known merge conflict in %s (kept upstream's and the PR's change)." % path)
          open(sys.argv[1], "w").write("\n".join(done) + "\n")
          PY
          }

          if [ "$PR_HEAD" = "merged" ]; then
            echo "- PR #$PR_NUMBER is already part of upstream (nothing to add)." >> "$INCLUDED"
          else
            RESOLVED="$OUT/resolved-conflicts.txt"
            : > "$RESOLVED"
            if ! git merge --no-ff --no-edit -m "Merge dashdogy PR #$PR_NUMBER on top of upstream $UP_SHORT" "refs/remotes/pr/$PR_NUMBER"; then
              resolve_known_conflicts "$RESOLVED" || give_up "PR #$PR_NUMBER"
              git commit -q --no-edit
            fi
            echo "- [PR #$PR_NUMBER](https://github.com/$UPSTREAM_REPO/pull/$PR_NUMBER): $PR_TITLE (head \`${PR_HEAD:0:8}\`)" >> "$INCLUDED"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "  - Needed a hand-made merge with newer upstream code in \`$f\` (both changes kept; the exact result is in \`combined-source.patch\`)." >> "$INCLUDED"
            done < "$RESOLVED"
          fi

          for sha in $EXTRAS; do
            git fetch --no-tags "https://github.com/$DASH_REPO.git" "$sha"
            subject=$(git log -1 --format=%s "$sha")
            git cherry-pick --no-commit "$sha" || give_up "'$subject' (${sha:0:8})"
            if git diff --cached --quiet; then
              echo "- \`${sha:0:8}\` $subject: already part of upstream (nothing to add)." >> "$INCLUDED"
              git reset -q --hard HEAD
            else
              git commit -q -C "$sha"
              echo "- [\`${sha:0:8}\`](https://github.com/$DASH_REPO/commit/$sha) $subject" >> "$INCLUDED"
            fi
          done

          # ---- 4. Record the exact source change (GPL source offer) ----------
          git diff --binary "$UP_SHA" HEAD > "$OUT/combined-source.patch"
          HEAD_SHORT=$(git rev-parse --short HEAD)
          HAS_PATCH=false
          if [ -s "$OUT/combined-source.patch" ]; then
            HAS_PATCH=true
          else
            echo "::notice::Upstream already contains every OptiScaler change listed here. Building anyway, for MFG Unlocker and the two dlssg-to-xefg builds."
          fi

          # ---- 5. Version and file name --------------------------------------
          ver() { grep -m1 -E "^#define $1[[:space:]]" OptiScaler/resource.h | awk '{print $3}' | tr -d '\r'; }
          VERSION="v$(ver VER_MAJOR_VERSION).$(ver VER_MINOR_VERSION).$(ver VER_HOTFIX_VERSION)-pre$(ver VER_BUILD_NUMBER)"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pre[0-9]+$ ]] || { echo "::error::Could not read the version from OptiScaler/resource.h (got '$VERSION')."; exit 1; }
          FILENAME="OptiMorning_${VERSION}_$(date -u +%Y%m%d)"

          # ---- 6. Hand everything to the later steps -------------------------
          # (a small file that later steps load with "source")
          for v in FP SAME_TAGS VERSION FILENAME UP_SHA UP_SHORT UP_DATE UP_SUBJECT HEAD_SHORT HAS_PATCH MFG_TAG DLSSG_SHA DLSSG_SUBJECT DLSSG_MX_SHA DLSSG_MX_SUBJECT PREV_UP_SHA PREV_DLSSG_SHA PREV_DLSSG_MX_SHA; do
            printf '%s=%q\n' "$v" "${!v}"
          done > "$OUT/vars.sh"
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Fetch add-ons (both dlssg-to-xefg sources, MFG Unlocker release)
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          source "$GITHUB_WORKSPACE/out/vars.sh"

          # Both dlssg-to-xefg repos are fetched shallow, which skips git submodules.
          # Since 2026-11-04 FakeMichau's repo builds a Vulkan/D3D12 layer from two of
          # them (third_party/Vulkan-Headers and third_party/dxil-spirv); left empty,
          # its build fails. dxil-spirv has submodules of its own; only spirv-headers
          # and dxbc-spirv are needed to build its C API (the same two FakeMichau's
          # own CI fetches). A repo without .gitmodules is left alone (realdody's fork
          # has none yet, but follows FakeMichau closely, so this covers him too).
          fetch_submodules() {   # $1 = folder, $2 = name for the messages
            local dir="$1" name="$2" sub
            [ -f "$dir/.gitmodules" ] || return 0
            echo "$name uses git submodules, fetching them"
            git -C "$dir" submodule update --init --depth 1 --jobs 2
            if [ -d "$dir/third_party/dxil-spirv" ]; then
              git -C "$dir/third_party/dxil-spirv" submodule update --init --depth 1 \
                third_party/spirv-headers subprojects/dxbc-spirv
            fi
            while read -r sub; do
              [ -n "$(ls -A "$dir/$sub" 2> /dev/null)" ] || { echo "::error::$name: the submodule $sub is empty after fetching it."; exit 1; }
            done < <(git -C "$dir" config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          }

          # dlssg-to-xefg: the exact commit chosen in the plan step
          git init -q dlssg
          git -C dlssg fetch -q --depth 1 "https://github.com/$DLSSG_REPO.git" "$DLSSG_SHA"
          git -C dlssg checkout -q FETCH_HEAD
          fetch_submodules dlssg "FakeMichau's dlssg-to-xefg"

          # dlssg-to-xefg, realdody's fork: the exact commit chosen in the plan step
          git init -q dlssg-mx
          git -C dlssg-mx fetch -q --depth 1 "https://github.com/$DLSSG_MX_REPO.git" "$DLSSG_MX_SHA"
          git -C dlssg-mx checkout -q FETCH_HEAD
          fetch_submodules dlssg-mx "realdody's dlssg-to-xefg"

          # MFG Unlocker: the release normally holds a ZIP with MFGUnlocker.dll
          # inside; a bare DLL is accepted too.
          mkdir mfg
          gh release download "$MFG_TAG" --repo "$MFG_REPO" --pattern '*.zip' --pattern 'MFGUnlocker.dll' --dir mfg
          for z in mfg/*.zip; do
            7z e -y -r -omfg "$z" MFGUnlocker.dll > /dev/null
          done
          [ -f mfg/MFGUnlocker.dll ] || { echo "::error::MFGUnlocker.dll not found in release $MFG_TAG of $MFG_REPO."; ls -la mfg; exit 1; }

      - name: Fetch OptiScaler libraries (submodules)
        if: steps.plan.outputs.build == 'true'
        working-directory: src
        run: git submodule update --init --depth 1 --jobs 4

      - name: Add MSBuild to PATH
        if: steps.plan.outputs.build == 'true'
        uses: microsoft/setup-msbuild@v3

      # Three separate steps, so a red X in the Actions list says which project broke.

      - name: Build OptiScaler (Release x64)
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          msbuild -version
          msbuild src/OptiScaler.sln /m /p:Configuration=Release /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build dlssg-to-xefg, FakeMichau (Release x64)
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          # Its project first builds dxil-spirv with CMake (uses the submodules fetched
          # above; needs cmake, which windows-latest has). This takes a few minutes.
          cmake --version
          msbuild dlssg/dlssg-to-xefg.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build dlssg-to-xefg, realdody (Release x64)
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          # realdody's build also downloads the pinned MFG-Unlocker release (SHA-256
          # checked) and extracts bin\Release\xefg_mfg_programs from it. Needs internet.
          msbuild dlssg-mx/dlssg-to-xefg.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          shopt -s nocaseglob nullglob
          source "$GITHUB_WORKSPACE/out/vars.sh"

          OUT="$GITHUB_WORKSPACE/out"
          STAGE="$GITHUB_WORKSPACE/stage"
          BUILT="src/x64/Release/a"
          DLSSG_DLL="dlssg/bin/Release/dlssg_to_xefg_intel_is_better.dll"
          DLSSG_MX_DLL="dlssg-mx/bin/Release/dlssg_to_xefg_intel_is_better.dll"
          MX_PROGRAMS="dlssg-mx/bin/Release/xefg_mfg_programs"
          FETCHER_BAT="src/Streamlined_fetcher_windows.bat"
          PLUGINS="$STAGE/OptiScaler/plugins"
          DLSSG_DIR="$STAGE/OptiScaler/custom/NvngxXeFG/dlssg"
          MX_DIR="$STAGE/OptiScaler/custom/$DLSSG_MX_FOLDER/dlssg"

          # Everything we need must exist, or we stop here.
          for p in "$BUILT/OptiScaler.dll" "$BUILT/OptiScaler" "$DLSSG_DLL" "$DLSSG_MX_DLL" "$MX_PROGRAMS/programs.tsv" \
                   dlssg-mx/LICENSE dlssg-mx/NOTICE.md mfg/MFGUnlocker.dll "$FETCHER_BAT"; do
            [ -e "$p" ] || { echo "::error::Missing build output: $p"; ls -la "$(dirname "$p")" || true; exit 1; }
          done

          # Start from the normal nightly layout, then add our parts.
          mkdir -p "$STAGE" "$PLUGINS" "$DLSSG_DIR" "$MX_DIR" "$STAGE/Licenses"
          cp -a "$BUILT/." "$STAGE/"
          cp mfg/MFGUnlocker.dll "$PLUGINS/MFGUnlocker.asi"
          cp "$DLSSG_DLL" "$DLSSG_DIR/"
          cp "$DLSSG_MX_DLL" "$MX_DIR/"
          cp -r "$MX_PROGRAMS" "$MX_DIR/"

          # The tensor-core fatbin is part of that folder (the build puts it there).
          # It is optional at runtime, so a missing one is only a warning.
          if [ -z "$(find "$MX_DIR/xefg_mfg_programs" -type f -iname 'xefg_cuda_layers.fatbin' -print -quit)" ]; then
            echo "::warning::xefg_cuda_layers.fatbin is not in the realdody build output. The package still works, but without the tensor-core route on RTX GPUs."
          fi

          # Licence and notice files of realdody's fork (GPL-3.0, plus the MIT text
          # for the code ported from MFG-Unlocker). They go next to the other
          # licences, not into the dlssg folder, which keeps its exact layout.
          cp dlssg-mx/LICENSE   "$STAGE/Licenses/dlssg-to-xefg-realdody_LICENSE.txt"
          cp dlssg-mx/NOTICE.md "$STAGE/Licenses/dlssg-to-xefg-realdody_NOTICE.md"

          # The official nightlies also ship Streamlined_fetcher_windows.bat inside
          # the OptiScaler folder (their workflow copies it from the repo root).
          cp "$FETCHER_BAT" "$STAGE/OptiScaler/"

          # Both dlssg-to-xefg folders also need a COPY of every libxe*.dll next to
          # the DLL. Today that is libxell, libxess, libxess_dx11 and libxess_fg.
          # realdody's DLL needs libxess_fg.dll there (unless the game loads its
          # own), so it is the one file that is checked by name. Its tensor-core
          # layers are hashed for libxess_fg.dll 1.3.1 (XeSS SDK 3.0.2); other
          # versions may leave some layers on DXIL, so the version is logged below.
          LIBS=("$STAGE"/OptiScaler/libxe*.dll)
          [ "${#LIBS[@]}" -gt 0 ] || { echo "::error::No libxe*.dll in the OptiScaler folder of the build output."; ls -la "$STAGE/OptiScaler"; exit 1; }
          [ -f "$STAGE/OptiScaler/libxess_fg.dll" ] || { echo "::error::libxess_fg.dll is not in the OptiScaler folder of the build output, realdody's dlssg-to-xefg needs it next to its DLL."; ls -la "$STAGE/OptiScaler"; exit 1; }
          FG_VER=$(FG_DLL="$STAGE/OptiScaler/libxess_fg.dll" pwsh -NoProfile -Command '$v = (Get-Item -LiteralPath $env:FG_DLL).VersionInfo; "$($v.FileVersion) $($v.ProductVersion)"' 2> /dev/null | tr -d '\r' || true)
          echo "libxess_fg.dll version: ${FG_VER:-unknown}"
          if [[ "$FG_VER" != *1.3.1* ]]; then
            echo "::warning::libxess_fg.dll is '${FG_VER:-unknown}', not 1.3.1 (XeSS SDK 3.0.2). realdody's tensor-core layers target 1.3.1 and may stay on DXIL with other versions."
          fi
          cp "${LIBS[@]}" "$DLSSG_DIR/"
          cp "${LIBS[@]}" "$MX_DIR/"

          # GPL source patch, only when the build differs from upstream.
          if [ "$HAS_PATCH" = "true" ]; then
            cp "$OUT/combined-source.patch" "$STAGE/OptiScaler/"
          fi

          echo "Added to the package:"
          find "$PLUGINS" "$DLSSG_DIR" "$STAGE/OptiScaler/Streamlined_fetcher_windows.bat" -type f | sed "s|^$STAGE/||"
          find "$MX_DIR" -maxdepth 1 -type f | sed "s|^$STAGE/||"
          echo "${MX_DIR#$STAGE/}/xefg_mfg_programs/  ($(find "$MX_DIR/xefg_mfg_programs" -type f | wc -l) files)"
          find "$STAGE/Licenses" -name 'dlssg-to-xefg-realdody_*' -type f | sed "s|^$STAGE/||"

          (cd "$STAGE" && 7z a -r "$OUT/$FILENAME.7z" '*' > /dev/null)
          ls -la "$OUT/$FILENAME.7z"

      - name: Publish release and delete old ones
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/out/vars.sh"
          OUT="$GITHUB_WORKSPACE/out"
          NOTES="$OUT/notes.md"

          # ---- Helpers for the notes -----------------------------------------
          # Makes a commit subject safe to paste into the notes: no stray markdown,
          # no @mentions (they would ping people), and "#123" links to the
          # repository the commit came from instead of to this one.
          md_clean() {
            sed -E 's/([]\\`*_<>[|])/\\\1/g; s,(^|[^[:alnum:]])#([0-9]+),\1[#\2](https://github.com/'"$1"'/pull/\2),g; s/@/@\&#8203;/g'
          }

          # Prints the "what changed" part of one section.
          #   $1 owner/repo   $2 commit the LAST release was built from (may be empty)
          #   $3 commit THIS build uses   $4 subject of $3 (used when nothing can be compared)
          changes() {
            local repo="$1" base="$2" head="$3" subject="$4" lines="" n=0 sha subj
            if [ -n "$base" ] && [ "$base" = "$head" ]; then
              printf 'No new commits since the last release (still [`%s`](https://github.com/%s/commit/%s)).\n' "${head:0:8}" "$repo" "$head"
              return
            fi
            if [ -n "$base" ]; then
              # The API lists oldest first; tac flips that. If the lookup fails
              # (say the old commit was force-pushed away) there is just no list.
              lines=$(gh api --paginate "repos/$repo/compare/$base...$head?per_page=100" \
                --jq '.commits[] | .sha + "\t" + (.commit.message | split("\n")[0])' 2> /dev/null \
                | tr -d '\r' | tac || true)
            fi
            if [ -z "$lines" ]; then
              printf -- '- [`%s`](https://github.com/%s/commit/%s) %s\n' "${head:0:8}" "$repo" "$head" "$(printf '%s' "$subject" | md_clean "$repo")"
              return
            fi
            printf 'Changes since the last release ([compare](https://github.com/%s/compare/%s...%s)):\n\n' "$repo" "$base" "$head"
            while IFS=$'\t' read -r sha subj; do
              n=$((n + 1))
              [ "$n" -le "$NOTES_MAX_COMMITS" ] || continue
              printf -- '- [`%s`](https://github.com/%s/commit/%s) %s\n' "${sha:0:8}" "$repo" "$sha" "$(printf '%s' "$subj" | md_clean "$repo")"
            done <<< "$lines"
            if [ "$n" -gt "$NOTES_MAX_COMMITS" ]; then
              printf -- '- ... and %s older commits (see the compare link above).\n' "$((n - NOTES_MAX_COMMITS))"
            fi
          }

          {
            printf '**Unofficial combined build.** Do not report problems with this build to the OptiScaler team or to the authors of the parts added below.\n\n'

            printf '### OptiScaler nightly\n\n'
            printf 'Official OptiScaler `%s`, the same code the official nightlies are built from.\n\n' "$VERSION"
            changes "$UPSTREAM_REPO" "$PREV_UP_SHA" "$UP_SHA" "$UP_SUBJECT"

            printf '\n### dashdogy\n\n'
            printf 'OptiScaler changes that are not in official OptiScaler yet:\n\n'
            cat "$OUT/included.md"
            printf '\nMFG Unlocker:\n\n'
            printf -- '- [MFG Unlocker `%s`](https://github.com/%s/releases/tag/%s): the official release DLL, unmodified, installed as `OptiScaler/plugins/MFGUnlocker.asi`.\n' "$MFG_TAG" "$MFG_REPO" "$MFG_TAG"

            printf '\n### FakeMichau\n\n'
            printf '[dlssg-to-xefg](https://github.com/%s), built from source into `OptiScaler/custom/NvngxXeFG/dlssg`.\n\n' "$DLSSG_REPO"
            changes "$DLSSG_REPO" "$PREV_DLSSG_SHA" "$DLSSG_SHA" "$DLSSG_SUBJECT"

            printf '\n### realdody\n\n'
            printf '[dlssg-to-xefg](https://github.com/%s) (XMX multi-frame-generation fork), built from source into `OptiScaler/custom/%s/dlssg`.\n\n' "$DLSSG_MX_REPO" "$DLSSG_MX_FOLDER"
            changes "$DLSSG_MX_REPO" "$PREV_DLSSG_MX_SHA" "$DLSSG_MX_SHA" "$DLSSG_MX_SUBJECT"
            printf '\n`xefg_mfg_programs` (XeSS MFG program set and tensor-core fatbin) is made by the realdody build itself: it downloads the pinned MFG-Unlocker release DLL and extracts the folder from it, verified against SHA-256 values pinned in its source. The folder is shipped unmodified. The program set is derived from Intel XeSS program data and stays under the Intel licence terms.\n'
            printf '\nOn RTX 20/30/40/50 GPUs the tensor-core route is used when possible (the log shows `cuda_route active`); set `XEFG_TENSOR_CORES=0` to force the DXIL path. Its layers target `libxess_fg.dll` 1.3.1 (XeSS SDK 3.0.2); other versions may keep some layers on DXIL.\n'

            printf '\n### Install\n\n'
            printf 'Install as normal OptiScaler.\n\n'
            printf '**Note:** to use dashdogy'"'"'s version, enable the plugin (MFG Unlocker). To use FakeMichau'"'"'s or realdody'"'"'s, disable the plugin.\n'

            # Hidden from the page. The next build reads it to see where this one stopped.
            printf '\n<!-- opti-morning: upstream=%s fakemichau=%s realdody=%s -->\n' "$UP_SHA" "$DLSSG_SHA" "$DLSSG_MX_SHA"
          } > "$NOTES"
          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"

          # A forced rebuild replaces the release(s) already built from the same
          # inputs (the new one gets a fresh tag below).
          for old in $SAME_TAGS; do
            echo "Replacing earlier release $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2> /dev/null || true
          done

          # ---- Tag name and sorting fix --------------------------------------
          # GitHub sorts the Releases page by the DATE of the commit the tag points
          # to (the calendar day only, the time of day is ignored), not by when the
          # release was published. Releases of the same day are ordered by tag
          # name, reverse alphabetical, because "build-..." is not a version
          # number. Two things make the newest build always land on top:
          #   1. The tag name starts with the build time (UTC):
          #      build-<date>-<time>-<fingerprint>. Within one day a later build
          #      then has the alphabetically later name. (A name made only of
          #      the fingerprint hash put same-day builds in random order.)
          #   2. The tag points to a new commit dated right now (same files as
          #      $GITHUB_SHA, nothing on any branch, nothing in your history), so a
          #      later day always sorts above an earlier one. (Pointing every
          #      release at $GITHUB_SHA itself would give them all the same date.)
          EPOCH=$(date -u +%s)
          NOW=$(date -u -d "@$EPOCH" +%Y-%m-%dT%H:%M:%SZ)
          TAG="build-$(date -u -d "@$EPOCH" +%Y%m%d-%H%M%S)-$FP"
          BASE_TREE=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.tree.sha')
          STAMP_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            -f "message=Opti Morning $UP_DATE ($UP_SHORT)" \
            -f "tree=$BASE_TREE" \
            -f "parents[]=$GITHUB_SHA" \
            -f "author[name]=combined-build" \
            -f "author[email]=combined-build@users.noreply.github.com" \
            -f "author[date]=$NOW" \
            -f "committer[name]=combined-build" \
            -f "committer[email]=combined-build@users.noreply.github.com" \
            -f "committer[date]=$NOW" \
            --jq '.sha')
          [ -n "$STAMP_SHA" ] || { echo "::error::Could not create the dated commit for the release tag."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$STAMP_SHA" > /dev/null
          echo "Tag $TAG -> $STAMP_SHA (dated $NOW)"

          # The tag already exists now, so no --target is needed.
          gh release create "$TAG" "$OUT/$FILENAME.7z" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Opti Morning $UP_DATE ($UP_SHORT)" \
            --notes-file "$NOTES" \
            --latest

          # Keep only the newest KEEP_RELEASES releases made by this workflow
          # (tags starting with "build-").
          if [ "$KEEP_RELEASES" -gt 0 ]; then
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[].tagName | select(startswith("build-"))' \
              | tr -d '\r' | tail -n +"$((KEEP_RELEASES + 1))" \
              | while read -r old; do
                  echo "Removing old release $old"
                  gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
                done
          fi
