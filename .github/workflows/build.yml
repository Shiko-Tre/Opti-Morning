# =============================================================================
#  OptiScaler + dashdogy  --  automatic combined build
# =============================================================================
#
#  What this does, every day (and whenever you press "Run workflow"):
#    1. Takes the latest official OptiScaler code (the same code the nightlies
#       are built from).
#    2. Adds dashdogy's work that is NOT in official OptiScaler yet:
#         - pull request #1240  (XeFG on Vulkan)
#         - commit 6089672c     (menu/overlay + FSR-FG present fix, "pairfix.1")
#    3. Builds OptiScaler.dll on a Windows machine.
#    4. Publishes it on the Releases tab of THIS repository.
#
#  Safety rules built in:
#    - If nothing changed since the last build, it does nothing (no duplicate).
#    - If dashdogy's changes no longer fit the newest upstream code, the run
#      FAILS (red X, you get an email) and NO release is published. The
#      previous release stays available.
#    - If upstream later merges one of these changes itself, the workflow
#      notices and stops adding it. If everything is upstream, it stops building.
#
#  HOW TO USE (first time)
#    1. Create a new PUBLIC repository on GitHub (public = free build minutes).
#    2. Put this file at:   .github/workflows/build-combined.yml
#    3. Actions tab -> "OptiScaler + dashdogy (combined build)" -> Run workflow.
#    4. After ~15-25 minutes the build appears under "Releases".
#
#    Only if the run fails when publishing with "Resource not accessible by
#    integration": Settings -> Actions -> General -> Workflow permissions ->
#    "Read and write permissions" -> Save, then run it again.
#
#  THINGS YOU MAY WANT TO EDIT: only the `env:` block below.
#
#  Heads-up: GitHub pauses scheduled workflows in a repository that has had no
#  commits for 60 days. If that happens, GitHub emails you; click "Enable".
#
#  Licence: OptiScaler is GPL-3.0. Every release includes combined-source.patch
#  (exact changes on top of the named upstream commit) so the source is
#  available alongside the binary.
# =============================================================================

name: OptiScaler + dashdogy (combined build)

on:
  schedule:
    # 06:15 UTC every day, about 2 hours after upstream's own nightly build.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "OptiScaler branch, tag or commit to build on top of"
        required: false
        default: "master"
      force:
        description: "Rebuild even if this exact combination was already released"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: combined-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: optiscaler/OptiScaler
  DASH_REPO: dashdogy/OptiScaler

  # The open pull request to add. If upstream merges it, it is skipped
  # automatically. If a new PR replaces it, change this number.
  PR_NUMBER: "1240"

  # Extra single commits from dashdogy's fork to add after the PR.
  # One FULL 40-character commit ID per line; text after # is a comment.
  EXTRA_COMMITS: |
    6089672c10b13e8aaca50b94ee1bfc2b51c70d30  # pairfix.1: menu/overlay allocator ring + FSR-FG present while FG is off

  # How many combined releases to keep (older ones are deleted). 0 = keep all.
  KEEP_RELEASES: "20"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out official OptiScaler
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || 'master' }}
          fetch-depth: 0
          submodules: false
          path: src

      - name: Work out what to build and merge it
        id: plan
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          INCLUDED="$OUT/included.md"
          : > "$INCLUDED"

          # "build" is only ever set to true at the very end. Any early exit
          # leaves it empty, which makes every later step skip itself.

          UP_SHA=$(git rev-parse HEAD)
          UP_SHORT=$(git rev-parse --short=8 HEAD)
          UP_SUBJECT=$(git log -1 --format=%s)
          UP_DATE=$(git log -1 --format=%cs)
          echo "Upstream: $UP_SHORT  $UP_SUBJECT  ($UP_DATE)"

          # ---- 1. Is the pull request still open upstream? -------------------
          PR_STATE=$(gh api "repos/$UPSTREAM_REPO/pulls/$PR_NUMBER" --jq '.state')
          PR_MERGED=$(gh api "repos/$UPSTREAM_REPO/pulls/$PR_NUMBER" --jq '.merged')
          PR_TITLE=$(gh api "repos/$UPSTREAM_REPO/pulls/$PR_NUMBER" --jq '.title')

          PR_HEAD="merged"
          if [ "$PR_MERGED" = "true" ]; then
            echo "::notice::PR #$PR_NUMBER is already merged into upstream, so there is nothing extra to add for it."
          else
            if [ "$PR_STATE" != "open" ]; then
              echo "::warning::PR #$PR_NUMBER was closed without being merged. Building it anyway; check whether a newer PR replaced it."
            fi
            git fetch --no-tags origin "pull/$PR_NUMBER/head:refs/remotes/pr/$PR_NUMBER"
            PR_HEAD=$(git rev-parse "refs/remotes/pr/$PR_NUMBER")
          fi

          # ---- 2. Read and check the extra commit list -----------------------
          EXTRAS=""
          while IFS= read -r line; do
            line="${line%%#*}"
            line=$(printf '%s' "$line" | tr -d '[:space:]')
            [ -z "$line" ] && continue
            if ! [[ "$line" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::EXTRA_COMMITS needs full 40-character commit IDs. Got: $line"
              exit 1
            fi
            EXTRAS="$EXTRAS $line"
          done <<< "$EXTRA_COMMITS"

          # ---- 3. Same inputs as an existing release? Then nothing to do -----
          FP=$(printf '%s\n' "$UP_SHA" "$PR_HEAD" $EXTRAS | sha1sum | cut -c1-12)
          TAG="build-$FP"
          echo "Fingerprint $FP  (release tag $TAG)"

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "::notice::Nothing new since the last build ($TAG already exists). Nothing to do."
              {
                echo "### Nothing to do"
                echo "Upstream \`$UP_SHORT\` + the same dashdogy changes were already built as release \`$TAG\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Force rebuild requested: the existing release $TAG will be replaced."
          fi

          # ---- 4. Merge everything onto upstream -----------------------------
          git config user.name  "combined-build"
          git config user.email "combined-build@users.noreply.github.com"

          ADDED=0

          give_up() {
            local what="$1"
            local files
            files=$(git diff --name-only --diff-filter=U || true)
            {
              echo "### Build skipped: $what no longer fits upstream \`$UP_SHORT\`"
              echo
              echo "Files in conflict:"
              printf '%s\n' "$files" | sed 's/^/- /'
              echo
              echo "No release was published; the previous release is untouched."
              echo "Usually dashdogy has to update his pull request (or upstream has to settle)."
              echo "Running again tomorrow, or after he updates, may work."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Merge conflict::$what does not apply cleanly on upstream $UP_SHORT. See the run summary."
            git merge --abort 2> /dev/null || true
            git cherry-pick --quit 2> /dev/null || true
            git reset -q --hard HEAD || true
            exit 1
          }

          if [ "$PR_HEAD" != "merged" ]; then
            if git merge --no-ff --no-edit -m "Merge dashdogy PR #$PR_NUMBER on top of upstream $UP_SHORT" "refs/remotes/pr/$PR_NUMBER"; then
              ADDED=$((ADDED + 1))
              echo "- [PR #$PR_NUMBER](https://github.com/$UPSTREAM_REPO/pull/$PR_NUMBER): $PR_TITLE (head \`${PR_HEAD:0:8}\`)" >> "$INCLUDED"
            else
              give_up "PR #$PR_NUMBER"
            fi
          else
            echo "- PR #$PR_NUMBER is already part of upstream (nothing to add)." >> "$INCLUDED"
          fi

          for sha in $EXTRAS; do
            git fetch --no-tags "https://github.com/$DASH_REPO.git" "$sha"
            subject=$(git log -1 --format=%s "$sha")
            if git cherry-pick --no-commit "$sha"; then
              if git diff --cached --quiet; then
                echo "::notice::'$subject' is already part of upstream, skipped."
                echo "- \`${sha:0:8}\` $subject: already part of upstream (nothing to add)." >> "$INCLUDED"
                git reset -q --hard HEAD
              else
                git commit -q -C "$sha"
                ADDED=$((ADDED + 1))
                echo "- [\`${sha:0:8}\`](https://github.com/$DASH_REPO/commit/$sha) $subject" >> "$INCLUDED"
              fi
            else
              give_up "'$subject' (${sha:0:8})"
            fi
          done

          if [ "$ADDED" -eq 0 ]; then
            echo "::notice::Upstream already contains everything this workflow adds. Use the official nightly instead."
            {
              echo "### Nothing to add"
              echo "Upstream \`$UP_SHORT\` already contains all of dashdogy's changes listed here. The official nightly is enough."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- 5. Record the exact source change (GPL source offer) ----------
          git diff --binary "$UP_SHA" HEAD > "$OUT/combined-source.patch"
          HEAD_SHORT=$(git rev-parse --short HEAD)

          # ---- 6. Version and file names (same scheme as upstream) -----------
          ver() { grep -m1 -E "^#define $1[[:space:]]" OptiScaler/resource.h | awk '{print $3}' | tr -d '\r'; }
          VERSION="v$(ver VER_MAJOR_VERSION).$(ver VER_MINOR_VERSION).$(ver VER_HOTFIX_VERSION)-pre$(ver VER_BUILD_NUMBER)"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pre[0-9]+$ ]]; then
            echo "::error::Could not read the version from OptiScaler/resource.h (got '$VERSION')."
            exit 1
          fi
          FILENAME="OptiScaler_${VERSION}_$(date -u +%Y%m%d)_dashdogy"

          {
            echo "build=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "filename=$FILENAME"
            echo "up_short=$UP_SHORT"
            echo "up_subject=$UP_SUBJECT"
            echo "up_date=$UP_DATE"
            echo "head_short=$HEAD_SHORT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Plan"
            echo "- Upstream: \`$UP_SHORT\` ($UP_DATE) $UP_SUBJECT"
            echo "- Version: $VERSION"
            echo "- Added on top:"
            sed 's/^/  /' "$INCLUDED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch libraries (submodules)
        if: steps.plan.outputs.build == 'true'
        working-directory: src
        run: git submodule update --init --depth 1 --jobs 4

      - name: Add MSBuild to PATH
        if: steps.plan.outputs.build == 'true'
        uses: microsoft/setup-msbuild@v3

      - name: Build (Release x64)
        if: steps.plan.outputs.build == 'true'
        working-directory: src
        shell: pwsh
        run: msbuild /m /p:Configuration=Release /verbosity:minimal OptiScaler.sln

      - name: Package
        id: package
        if: steps.plan.outputs.build == 'true'
        env:
          FILENAME: ${{ steps.plan.outputs.filename }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          BUILT="src/x64/Release/a"

          if [ ! -f "$BUILT/OptiScaler.dll" ]; then
            echo "::error::The build finished but $BUILT/OptiScaler.dll is missing."
            ls -la "$BUILT" || true
            exit 1
          fi

          cp "$BUILT/OptiScaler.dll" "$OUT/OptiScaler.dll"
          (cd "$BUILT" && 7z a -r "$OUT/$FILENAME.7z" '*' > /dev/null)

          echo "sha256=$(sha256sum "$OUT/OptiScaler.dll" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Publish release
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          FILENAME: ${{ steps.plan.outputs.filename }}
          UP_SHORT: ${{ steps.plan.outputs.up_short }}
          UP_SUBJECT: ${{ steps.plan.outputs.up_subject }}
          UP_DATE: ${{ steps.plan.outputs.up_date }}
          HEAD_SHORT: ${{ steps.plan.outputs.head_short }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          NOTES="$OUT/notes.md"

          {
            printf '**Unofficial combined build.** Official OptiScaler `%s` (%s, "%s") plus dashdogy'"'"'s changes that are not in official OptiScaler yet. Do not report problems with this build to the OptiScaler team.\n\n' "$UP_SHORT" "$UP_DATE" "$UP_SUBJECT"
            printf '### Added on top of upstream\n\n'
            cat "$OUT/included.md"
            printf '\n### Files\n\n'
            printf -- '- `OptiScaler.dll`: just the DLL. Put it over the OptiScaler.dll of a current official nightly, or use it as-is with MFG Unlocker.\n'
            printf -- '- `%s.7z`: full package, same layout as the official nightlies.\n' "$FILENAME"
            printf -- '- `combined-source.patch`: the exact source changes on top of upstream `%s` (GPL-3.0 source).\n\n' "$UP_SHORT"
            printf 'SHA-256 of OptiScaler.dll: `%s`\n\n' "$SHA256"
            printf 'The version string inside the game shows commit `%s`. That hash only exists in this build, it is not an upstream commit.\n' "$HEAD_SHORT"
          } > "$NOTES"

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          gh release create "$TAG" \
            "$OUT/OptiScaler.dll" \
            "$OUT/$FILENAME.7z" \
            "$OUT/combined-source.patch" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OptiScaler $VERSION + dashdogy ($UP_DATE, $UP_SHORT)" \
            --notes-file "$NOTES" \
            --prerelease

          echo "Published release $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete old releases
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP="${KEEP_RELEASES:-20}"
          if [ "$KEEP" -le 0 ]; then
            echo "KEEP_RELEASES is 0, keeping every release."
            exit 0
          fi

          # Only releases this workflow made (tag starts with "build-"), newest first.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("build-"))] | sort_by(.created_at) | reverse | .[].tag_name' \
            | tail -n +"$((KEEP + 1))" \
            | while read -r old; do
                old="${old%$'\r'}"
                [ -z "$old" ] && continue
                echo "Removing old release $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
