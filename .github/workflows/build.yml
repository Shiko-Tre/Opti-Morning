name: Build OptiScaler (upstream master + dashdogy)

# What this does, every time it runs:
#   1. Downloads the LATEST optiscaler/OptiScaler master
#   2. Merges dashdogy's branch on top (first branch in the list that merges cleanly)
#   3. Builds OptiScaler.dll with Visual Studio
#   4. Drops the new DLL into the latest official nightly package
#   5. Publishes the result as a Release in YOUR repo (see the "Releases" box on the repo's front page)

on:
  # The "Run workflow" button in the Actions tab
  workflow_dispatch:
    inputs:
      dash_branches:
        description: "dashdogy branches to merge, comma separated. The first one that merges cleanly is used. Type none for plain upstream."
        type: string
        default: "mfgunlocker,xefg-vk-interop-inputs"
      force:
        description: "Build even if nothing changed since the last build"
        type: boolean
        default: true

  # Automatic daily build. Cron times are UTC: 11:30 UTC = 19:30 Singapore.
  # (Upstream's own nightly finishes around 10:50 UTC, so we run after it.)
  # To turn the daily build off, delete these two lines (schedule + cron).
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write   # needed to create Releases

concurrency:
  group: opti-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022   # Visual Studio 2022, which is what OptiScaler documents. If GitHub ever retires it, try windows-latest.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DASH_URL: https://github.com/dashdogy/OptiScaler.git
      DASH_BRANCHES: ${{ inputs.dash_branches || 'mfgunlocker,xefg-vk-interop-inputs' }}
      FORCE: ${{ inputs.force }}
      KEEP_RELEASES: "14"   # how many old builds to keep; older ones are deleted automatically

    steps:
      - name: Git settings
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Get latest OptiScaler master (with submodules)
        uses: actions/checkout@v4
        with:
          repository: optiscaler/OptiScaler
          ref: master
          path: src
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Merge dashdogy's branch
        id: merge
        shell: bash
        working-directory: src
        run: |
          set -uo pipefail
          git config user.name  "optiscaler-custom-build"
          git config user.email "optiscaler-custom-build@users.noreply.github.com"

          mkdir -p "$GITHUB_WORKSPACE/meta"
          NOTES="$GITHUB_WORKSPACE/meta/merge-notes.md"
          : > "$NOTES"

          UP_FULL=$(git rev-parse HEAD)
          UP_SHORT=$(git rev-parse --short=7 HEAD)
          MERGED="none"
          DASH_FULL="none"
          DASH_SHORT="none"

          WANT_LOWER=$(echo "$DASH_BRANCHES" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ "$WANT_LOWER" != "none" ] && [ -n "$WANT_LOWER" ]; then
            git remote add dash "$DASH_URL"
            IFS=',' read -ra WANT <<< "$DASH_BRANCHES"
            for raw in "${WANT[@]}"; do
              b=$(echo "$raw" | xargs)
              [ -z "$b" ] && continue
              echo "::group::Trying dashdogy branch: $b"
              if ! git fetch --no-tags dash "refs/heads/$b"; then
                echo "::warning::dashdogy branch '$b' could not be fetched (renamed or deleted?)"
                echo "- \`$b\`: skipped (branch not found)" >> "$NOTES"
                echo "::endgroup::"
                continue
              fi
              TIP=$(git rev-parse FETCH_HEAD)
              BEFORE=$(git rev-parse HEAD)
              if git merge --no-edit --no-ff -m "Merge dashdogy/$b into upstream master" "$TIP"; then
                # same file contents as before the merge = his changes are already in upstream
                if [ "$(git rev-parse "$BEFORE^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ]; then
                  MERGED="$b (already in upstream)"
                  echo "- \`$b\`: everything in it is already in upstream master, nothing extra to merge" >> "$NOTES"
                else
                  MERGED="$b"
                  echo "- \`$b\`: merged cleanly" >> "$NOTES"
                fi
                DASH_FULL="$TIP"
                DASH_SHORT=$(git rev-parse --short=7 "$TIP")
                echo "::endgroup::"
                break
              else
                echo "::warning::dashdogy branch '$b' conflicts with the current upstream master, skipping it"
                git merge --abort 2>/dev/null || git reset --hard "$BEFORE"
                echo "- \`$b\`: skipped (merge conflict with current upstream master)" >> "$NOTES"
                echo "::endgroup::"
              fi
            done
          fi

          if [ "$MERGED" = "none" ]; then
            echo "::warning::No dashdogy branch was merged. This will be a plain upstream build."
          fi

          # A merge can move submodule pointers, so make sure they match the merged result
          git submodule sync --recursive
          git submodule update --init --recursive

          {
            echo "up_full=$UP_FULL"
            echo "up_short=$UP_SHORT"
            echo "dash_full=$DASH_FULL"
            echo "dash_short=$DASH_SHORT"
            echo "merged=$MERGED"
            echo "key=$UP_SHORT-$DASH_SHORT"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if this exact combination was already built
        id: check
        shell: bash
        env:
          KEY: ${{ steps.merge.outputs.key }}
        run: |
          set -uo pipefail
          EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | tr -d '\r' | grep -- "-$KEY\$" || true)
          if [ -n "$EXISTING" ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already built as $EXISTING, nothing new upstream or from dashdogy. Skipping."
            echo "### Nothing new to build" >> "$GITHUB_STEP_SUMMARY"
            echo "The latest build (\`$EXISTING\`) already has the newest upstream master and dashdogy branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TAG="build-$(date -u +%Y%m%d)-$KEY"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG="$TAG-r$GITHUB_RUN_NUMBER"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up MSBuild
        if: steps.check.outputs.skip != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Build OptiScaler (Release, x64)
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        working-directory: src
        run: msbuild OptiScaler.sln /restore /m /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Collect the DLL and make the package
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.check.outputs.tag }}
          UP_FULL: ${{ steps.merge.outputs.up_full }}
          DASH_FULL: ${{ steps.merge.outputs.dash_full }}
          MERGED: ${{ steps.merge.outputs.merged }}
        run: |
          $ErrorActionPreference = 'Stop'

          # --- find the DLL we just built ---
          $dll = Get-ChildItem -Path src -Recurse -Filter OptiScaler.dll -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch '[\\/]external[\\/]' } |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dll) {
            Write-Host "OptiScaler.dll not found. DLLs written during this build:"
            Get-ChildItem -Path src -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-90) } |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "The build finished but OptiScaler.dll was not produced"
          }
          Write-Host "Built: $($dll.FullName)"

          New-Item -ItemType Directory -Force -Path dist, meta | Out-Null
          Copy-Item $dll.FullName dist\OptiScaler.dll

          $info = @(
            "OptiScaler custom build",
            "Built (UTC)     : $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm'))",
            "Upstream master : https://github.com/optiscaler/OptiScaler/commit/$env:UP_FULL",
            "dashdogy branch : $env:MERGED",
            "dashdogy commit : $(if ($env:DASH_FULL -ne 'none') { "https://github.com/dashdogy/OptiScaler/commit/$env:DASH_FULL" } else { 'none' })",
            "Workflow run    : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "License         : GPL-3.0 (same as OptiScaler)"
          )

          # --- try to build a full package: latest official nightly + our DLL ---
          $mode = 'dll-only'
          $nightlyTag = $null
          try {
            $nightlyTag = (gh release list --repo optiscaler/OptiScaler-nightly --limit 1 --json tagName --jq '.[0].tagName')
            if ($LASTEXITCODE -ne 0 -or -not $nightlyTag) { throw "could not find the latest nightly" }
            Write-Host "Latest official nightly: $nightlyTag"

            New-Item -ItemType Directory -Force -Path base | Out-Null
            gh release download $nightlyTag --repo optiscaler/OptiScaler-nightly --pattern '*.7z' --dir base --clobber
            if ($LASTEXITCODE -ne 0 -or -not (Get-ChildItem base -Filter *.7z)) {
              gh release download $nightlyTag --repo optiscaler/OptiScaler-nightly --pattern '*.zip' --dir base --clobber
            }
            $archive = Get-ChildItem base -File | Where-Object { $_.Extension -in '.7z', '.zip' } | Select-Object -First 1
            if (-not $archive) { throw "no .7z/.zip asset on the nightly release" }

            7z x $archive.FullName -obase\x -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "could not extract $($archive.Name)" }

            $targets = Get-ChildItem base\x -Recurse -Filter OptiScaler.dll
            if (-not $targets) { throw "no OptiScaler.dll inside the nightly package" }
            foreach ($t in $targets) { Copy-Item $dll.FullName $t.FullName -Force; Write-Host "Replaced $($t.FullName)" }

            $info | Set-Content base\x\BUILD_INFO.txt
            $out = "dist\OptiScaler_custom_$env:TAG.7z"
            Push-Location base\x
            7z a -t7z -mx=5 "$env:GITHUB_WORKSPACE\$out" * | Out-Null
            $rc = $LASTEXITCODE
            Pop-Location
            if ($rc -ne 0) { throw "7z failed to create the package" }
            $mode = "full (official $nightlyTag + our OptiScaler.dll)"
          }
          catch {
            Write-Host "::warning::Full package not made ($($_.Exception.Message)). Publishing a DLL-only package instead."
            Remove-Item dist\OptiScaler_custom_*.7z -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path pkg | Out-Null
            Copy-Item $dll.FullName pkg\OptiScaler.dll
            if (Test-Path src\OptiScaler.ini) { Copy-Item src\OptiScaler.ini pkg\OptiScaler.ini }
            $info | Set-Content pkg\BUILD_INFO.txt
            Push-Location pkg
            7z a -t7z -mx=5 "$env:GITHUB_WORKSPACE\dist\OptiScaler_custom_${env:TAG}_dll-only.7z" * | Out-Null
            Pop-Location
          }
          $mode | Set-Content meta\package-mode.txt
          Write-Host "Package mode: $mode"
          Get-ChildItem dist | ForEach-Object { Write-Host "  $($_.Name)  ($([math]::Round($_.Length/1MB,1)) MB)" }
          exit 0

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.check.outputs.tag }}
          UP_FULL: ${{ steps.merge.outputs.up_full }}
          UP_SHORT: ${{ steps.merge.outputs.up_short }}
          DASH_FULL: ${{ steps.merge.outputs.dash_full }}
          MERGED: ${{ steps.merge.outputs.merged }}
        run: |
          set -euo pipefail
          MODE=$(tr -d '\r' < meta/package-mode.txt)
          {
            echo "Automatic build of the latest **optiscaler/OptiScaler** master with **dashdogy/OptiScaler** merged on top."
            echo
            echo "- Upstream master: [\`$UP_SHORT\`](https://github.com/optiscaler/OptiScaler/commit/$UP_FULL)"
            if [ "$DASH_FULL" != "none" ]; then
              echo "- dashdogy branch: \`$MERGED\` ([commit](https://github.com/dashdogy/OptiScaler/commit/$DASH_FULL))"
            else
              echo "- dashdogy branch: **none merged (plain upstream build)**"
            fi
            echo "- Package: $MODE"
            echo
            echo "Merge log:"
            cat meta/merge-notes.md
            echo
            echo "How to use: extract the .7z and install like normal OptiScaler. Or download just \`OptiScaler.dll\` and swap it into an existing install (keep whatever filename it was installed under, e.g. dxgi.dll)."
            echo
            echo "Unsigned build. The official releases are code-signed, this one is not. OptiScaler is GPL-3.0; source is the two commits linked above."
          } > meta/release-notes.md

          TITLE="OptiScaler custom build $(date -u +%Y-%m-%d) (upstream $UP_SHORT + dashdogy: $MERGED)"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file meta/release-notes.md

          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          {
            echo "### Build done"
            echo "**Download:** $URL"
            echo
            echo "- Upstream master: \`$UP_SHORT\`"
            echo "- dashdogy: \`$MERGED\`"
            echo "- Package: $MODE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete old builds
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -uo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("build-"))) | sort_by(.createdAt) | reverse | .[].tagName' \
            | tr -d '\r' \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r old; do
                [ -z "$old" ] && continue
                echo "Deleting old build $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
              done
          exit 0
